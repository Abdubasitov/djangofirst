{% extends "base.html" %} {% block content %}
<style>
	.container-weather {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 2rem;
		padding: 2rem;
		background: linear-gradient(to bottom, #e0f7fa, #ffffff);
		min-height: 100vh;
		font-family: 'Inter', sans-serif;
	}

	.refresh button {
		padding: 0.6rem 1.2rem;
		border: none;
		border-radius: 8px;
		background: #00acc1;
		color: #fff;
		font-weight: 600;
		cursor: pointer;
		transition: 0.2s;
	}

	.refresh button:hover {
		background: #00838f;
	}

	.card {
		width: 320px;
		background: #ffffff;
		border-radius: 12px;
		padding: 1.8rem 2rem;
		box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
		display: flex;
		flex-direction: column;
		gap: 1rem;
		transition: transform 0.2s ease;
	}

	.card:hover {
		transform: translateY(-6px);
	}

	.city {
		font-size: 1.6rem;
		font-weight: 700;
		color: #007c91;
		text-align: center;
	}

	.row {
		display: flex;
		justify-content: space-between;
		font-size: 1rem;
		color: #333;
	}

	.row .label {
		font-weight: 500;
	}

	.row .value {
		font-weight: 700;
	}

	.temperature {
		color: #ff5722;
	}

	.wind {
		color: #0288d1;
	}

	.description {
		font-style: italic;
		color: #555;
	}

	.empty {
		font-size: 1.2rem;
		color: #888;
		margin-top: 2rem;
	}

	.weather-icon {
		font-size: 1.4rem;
		margin-right: 0.5rem;
	}

	.container-icon {
		display: flex;
		align-items: center;
		gap: 10px;
	}
</style>

<div class="container-weather">
	<div class="refresh">
		<form method="get">
			<button type="submit">Обновить</button>
		</form>
	</div>

	{% if weather %} {% for item in weather %}
	<div class="card">
		<div class="city">{{ item.city }}</div>
		<div class="row">
			<span class="label">Температура:</span>
			<span class="value">{{ item.temperature }} °C</span>
		</div>
		<div class="row">
			<span class="label">Ветер:</span>
			<span class="value">{{ item.wind }} м/с</span>
		</div>
		<div class="row">
			<span class="label">Погода:</span>
			<div class="container-icon">
				<span class="value">{{ item.description }}</span>
				<span class="weather-icon">{{ item.icon }}</span>
			</div>
		</div>
	</div>
	{% endfor %} {% else %}
	<div class="empty">Нет данных</div>
	{% endif %}
</div>
{% endblock content %}
